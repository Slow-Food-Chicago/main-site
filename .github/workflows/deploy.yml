name: Deploy to DreamHost VPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add remote host to known_hosts
        run: ssh-keyscan -H ${{ secrets.DH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.DH_USER }}@${{ secrets.DH_HOST }} "cd ${{ secrets.DH_PATH }} && git pull origin main && npm run build && rm -rf ~/dev.slowfoodchicago.org/assets && cp -r dist/* ~/dev.slowfoodchicago.org"
