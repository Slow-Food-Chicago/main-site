name: Build and Deploy to Dreamhost

on:
  push:
    branches:
      - main # Triggers the workflow on push to the main branch

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24" # Specify your project's Node version
          cache: "npm" # Automatically caches npm dependencies

      - name: Install dependencies
        run: npm ci # Clean, deterministic installation for CI environments

      - name: Build project
        run: npm run build # Compiles your code into production assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build-artifacts
          path: dist/ # Change this to your build output folder (e.g., 'build', 'public')

  deploy:
    name: Deploy Application
    needs: build # Ensures this job only runs if the build job completes successfully
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build-artifacts
          path: dist/ # Downloads the files back into a folder named 'dist'
      
      - name: Deploy to Server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.DH_USER }}
          server: ${{ secrets.DH_HOST }}
          port: 22
          ssh_private_key: ${{ secrets.SSH_KEY }}
          local_path: './dist/*'          # The local source folder contents to upload
          remote_path: ${{ secrets.DH_PATH }}  # The target folder path on your remote server
          sftpArgs: '-o ConnectTimeout=5'
